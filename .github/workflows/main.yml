name: Pocket Dashboard Tests

run-name: "${{ github.event.client_payload.author }} - ${{ github.event.client_payload.message }}"

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag to run"
        required: false
        default: ""

  repository_dispatch:
    types: [amplify-deploy-complete]

permissions:
  contents: write

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------
      # CLEAN PREVIOUS REPORTS
      # ---------------------------------------------------------
      - name: Clean previous Cypress reports
        run: |
          echo "Cleaning previous Cypress reports..."

          rm -rf cypress/reports
          rm -rf cypress/results
          rm -rf mochawesome-report
          rm -rf public

          mkdir -p cypress/reports

          echo "Report directories cleaned."

      # ---------------------------------------------------------
      # RUN CYPRESS
      # ---------------------------------------------------------
      - name: Run Cypress tests
        id: cypress
        continue-on-error: true
        uses: cypress-io/github-action@v7
        with:
          record: true
          env: |
            tags=${{ github.event.inputs.tags }}

        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}

      # ---------------------------------------------------------
      # GENERATE MOCHAWESOME REPORT
      # ---------------------------------------------------------
      - name: Generate Mochawesome report
        if: always()
        run: |
          mkdir -p cypress/reports

          echo "Checking for Mochawesome JSON files..."

          if ls cypress/reports/*.json >/dev/null 2>&1; then

            echo "Mochawesome JSON files found:"
            ls -lah cypress/reports/*.json

            npx mochawesome-merge "cypress/reports/*.json" \
              -o cypress/reports/merged.json

            node -e '
              const fs = require("fs");
              const path = "cypress/reports/merged.json";
              const report = JSON.parse(fs.readFileSync(path, "utf8"));

              const strip = (title = "") =>
                title.replace(/\s*\(example #\d+\)\s*$/, "");

              const processTests = (tests = []) => {
                tests.forEach((test) => {
                  test.title = strip(test.title);
                  test.fullTitle = strip(test.fullTitle);
                });
              };

              const walkSuites = (suites = []) => {
                suites.forEach((suite) => {
                  processTests(suite.tests);
                  walkSuites(suite.suites);
                });
              };

              for (const result of report.results || []) {
                processTests(result.tests);
                for (const suite of result.suites || []) {
                  processTests(suite.tests);
                  walkSuites(suite.suites);
                }
              }

              fs.writeFileSync(path, JSON.stringify(report));

              console.log("Stripped (example #N) suffix from scenario outline test names.");
            '

            mkdir -p cypress/reports/mochawesome

            npx marge cypress/reports/merged.json \
              -f index \
              -o cypress/reports/mochawesome

            echo "Mochawesome report generated successfully."

          else
            echo "No Mochawesome JSON files found."
          fi

      # ---------------------------------------------------------
      # EXTRACT TEST STATISTICS
      # ---------------------------------------------------------
      - name: Extract Cypress test statistics
        id: stats
        if: always()
        run: |
          REPORT="cypress/reports/merged.json"

          if [ -f "$REPORT" ]; then

            PASSED=$(jq '.stats.passes // 0' "$REPORT")
            FAILED=$(jq '.stats.failures // 0' "$REPORT")
            PENDING=$(jq '.stats.pending // 0' "$REPORT")
            TESTS=$(jq '.stats.tests // 0' "$REPORT")
            DURATION=$(jq '.stats.duration // 0' "$REPORT")

          else

            PASSED=0
            FAILED=0
            PENDING=0
            TESTS=0
            DURATION=0

          fi

          DURATION_SECONDS=$((DURATION / 1000))

          MINUTES=$((DURATION_SECONDS / 60))
          SECONDS=$((DURATION_SECONDS % 60))

          if [ "$MINUTES" -gt 0 ]; then
            FORMATTED_DURATION="${MINUTES}m ${SECONDS}s"
          else
            FORMATTED_DURATION="${SECONDS}s"
          fi

          if [ "$TESTS" -gt 0 ]; then
            PASS_RATE=$(awk "BEGIN {printf \"%.1f\", ($PASSED / $TESTS) * 100}")
          else
            PASS_RATE="0.0"
          fi

          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "duration=$FORMATTED_DURATION" >> "$GITHUB_OUTPUT"
          echo "pass_rate=$PASS_RATE" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # COMMIT INFORMATION
      # ---------------------------------------------------------
      - name: Get commit information
        id: commit
        if: always()
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%an')
          MESSAGE=$(git log -1 --pretty=format:'%s')

          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          {
            echo "message<<EOF"
            echo "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # CYPRESS RESULT
      # ---------------------------------------------------------
      - name: Set Cypress result
        id: result
        if: always()
        run: |
          if [ "${{ steps.cypress.outcome }}" = "success" ]; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
            echo "icon=✅" >> "$GITHUB_OUTPUT"
            echo "slack_icon=:white_check_mark:" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "icon=❌" >> "$GITHUB_OUTPUT"
            echo "slack_icon=:x:" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------
      # UPLOAD REPORT ARTIFACT
      # ---------------------------------------------------------
      - name: Upload Cypress report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-html-report
          path: cypress/reports
          if-no-files-found: warn

      # ---------------------------------------------------------
      # UPLOAD SCREENSHOTS
      # ---------------------------------------------------------
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      # ---------------------------------------------------------
      # CREATE CUSTOM DASHBOARD
      # ---------------------------------------------------------
      - name: Create custom Cypress dashboard
        if: always()
        env:
          TESTS: ${{ steps.stats.outputs.tests }}
          PASSED: ${{ steps.stats.outputs.passed }}
          FAILED: ${{ steps.stats.outputs.failed }}
          PENDING: ${{ steps.stats.outputs.pending }}
          DURATION: ${{ steps.stats.outputs.duration }}
          PASS_RATE: ${{ steps.stats.outputs.pass_rate }}
          STATUS: ${{ steps.result.outputs.status }}
          AUTHOR: ${{ steps.commit.outputs.author }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ github.event.inputs.tags }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf public
          mkdir -p public

          if [ -f cypress/reports/merged.json ]; then

            if [ -z "$TAG" ]; then
              TAG="All tests"
            fi

            if [ "$STATUS" = "PASSED" ]; then
              STATUS_COLOR="#16a34a"
              STATUS_BG="#dcfce7"
              STATUS_ICON="✓"
              STATUS_TEXT="All tests passed"
            else
              STATUS_COLOR="#dc2626"
              STATUS_BG="#fee2e2"
              STATUS_ICON="!"
              STATUS_TEXT="Some tests failed"
            fi

            cp -r cypress/reports/mochawesome public/mochawesome

            cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">

            <meta
              name="viewport"
              content="width=device-width, initial-scale=1.0"
            >

            <title>Pocket Dashboard - Cypress Test Report</title>

            <style>
              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
              }

              body {
                font-family:
                  Inter,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  Helvetica,
                  Arial,
                  sans-serif;

                background:
                  linear-gradient(
                    135deg,
                    #f8fafc 0%,
                    #eef2ff 50%,
                    #f8fafc 100%
                  );

                color: #0f172a;
                min-height: 100vh;
              }

              .container {
                max-width: 1180px;
                margin: 0 auto;
                padding: 40px 24px 60px;
              }

              /* HEADER */

              .header {
                background:
                  linear-gradient(
                    135deg,
                    #111827 0%,
                    #1e293b 55%,
                    #312e81 100%
                  );

                color: white;
                border-radius: 24px;
                padding: 32px;
                position: relative;
                overflow: hidden;
                box-shadow:
                  0 20px 50px rgba(15, 23, 42, 0.18);
              }

              .header::before {
                content: "";
                position: absolute;
                width: 320px;
                height: 320px;
                border-radius: 50%;
                background: rgba(99, 102, 241, 0.18);
                right: -100px;
                top: -150px;
              }

              .header-content {
                position: relative;
                z-index: 1;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 24px;
              }

              .brand {
                display: flex;
                align-items: center;
                gap: 16px;
              }

              .logo {
                width: 54px;
                height: 54px;
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(255,255,255,0.12);
                border: 1px solid rgba(255,255,255,0.15);
                font-size: 25px;
              }

              .brand h1 {
                font-size: 27px;
                font-weight: 750;
                letter-spacing: -0.5px;
              }

              .brand p {
                margin-top: 4px;
                color: #cbd5e1;
                font-size: 14px;
              }

              .status {
                display: flex;
                align-items: center;
                gap: 10px;
                background: $STATUS_BG;
                color: $STATUS_COLOR;
                padding: 12px 18px;
                border-radius: 999px;
                font-weight: 700;
                font-size: 14px;
              }

              .status-icon {
                width: 25px;
                height: 25px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: $STATUS_COLOR;
                color: white;
                border-radius: 50%;
              }

              /* META */

              .meta {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 28px;
              }

              .pill {
                background: rgba(255,255,255,0.08);
                border: 1px solid rgba(255,255,255,0.1);
                color: #e2e8f0;
                padding: 8px 13px;
                border-radius: 10px;
                font-size: 13px;
              }

              .pill strong {
                color: white;
              }

              /* STATS */

              .stats {
                display: grid;
                grid-template-columns:
                  repeat(4, 1fr);

                gap: 18px;
                margin-top: 24px;
              }

              .card {
                background: rgba(255,255,255,0.9);
                border: 1px solid rgba(226,232,240,0.8);
                border-radius: 20px;
                padding: 24px;
                box-shadow:
                  0 10px 30px rgba(15,23,42,0.06);
              }

              .card-label {
                font-size: 13px;
                color: #64748b;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: .6px;
              }

              .card-value {
                font-size: 36px;
                font-weight: 800;
                margin-top: 8px;
                letter-spacing: -1px;
              }

              .total {
                color: #334155;
              }

              .passed {
                color: #16a34a;
              }

              .failed {
                color: #dc2626;
              }

              .pending {
                color: #d97706;
              }

              /* PASS RATE */

              .pass-rate {
                margin-top: 24px;
                background: white;
                border: 1px solid #e2e8f0;
                border-radius: 22px;
                padding: 28px;
                box-shadow:
                  0 10px 30px rgba(15,23,42,0.06);
              }

              .pass-rate-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 14px;
              }

              .pass-rate-title {
                font-size: 16px;
                font-weight: 700;
              }

              .percentage {
                font-size: 25px;
                font-weight: 800;
                color: $STATUS_COLOR;
              }

              .progress {
                height: 14px;
                background: #e2e8f0;
                border-radius: 999px;
                overflow: hidden;
              }

              .progress-bar {
                height: 100%;
                width: ${PASS_RATE}%;
                background:
                  linear-gradient(
                    90deg,
                    #4f46e5,
                    #22c55e
                  );
                border-radius: 999px;
                transition: width 1s ease;
              }

              /* DETAILS */

              .details {
                display: grid;
                grid-template-columns:
                  repeat(3, 1fr);

                gap: 18px;
                margin-top: 24px;
              }

              .detail {
                background: white;
                border: 1px solid #e2e8f0;
                border-radius: 18px;
                padding: 20px;
              }

              .detail-label {
                color: #64748b;
                font-size: 12px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: .5px;
              }

              .detail-value {
                margin-top: 7px;
                font-size: 15px;
                font-weight: 650;
                color: #1e293b;
                word-break: break-word;
              }

              /* ACTION */

              .action {
                margin-top: 24px;
                background:
                  linear-gradient(
                    135deg,
                    #4f46e5,
                    #6366f1
                  );

                border-radius: 20px;
                padding: 28px;
                color: white;

                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 20px;

                box-shadow:
                  0 15px 35px rgba(79,70,229,0.25);
              }

              .action h2 {
                font-size: 19px;
              }

              .action p {
                color: #e0e7ff;
                margin-top: 5px;
                font-size: 14px;
              }

              .button {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: white;
                color: #4338ca;
                padding: 13px 19px;
                border-radius: 12px;
                text-decoration: none;
                font-weight: 750;
                font-size: 14px;
                white-space: nowrap;
                transition: transform .2s ease;
              }

              .button:hover {
                transform: translateY(-2px);
              }

              /* FOOTER */

              footer {
                text-align: center;
                margin-top: 30px;
                color: #64748b;
                font-size: 12px;
              }

              /* RESPONSIVE */

              @media (max-width: 800px) {
                .header-content {
                  flex-direction: column;
                  align-items: flex-start;
                }

                .stats {
                  grid-template-columns:
                    repeat(2, 1fr);
                }

                .details {
                  grid-template-columns:
                    1fr;
                }

                .action {
                  flex-direction: column;
                  align-items: flex-start;
                }
              }

              @media (max-width: 520px) {
                .container {
                  padding: 20px 14px 40px;
                }

                .header {
                  padding: 24px;
                  border-radius: 18px;
                }

                .stats {
                  grid-template-columns: 1fr 1fr;
                  gap: 10px;
                }

                .card {
                  padding: 18px;
                }

                .card-value {
                  font-size: 28px;
                }

                .brand h1 {
                  font-size: 22px;
                }
              }
            </style>
          </head>

          <body>

            <div class="container">

              <section class="header">

                <div class="header-content">

                  <div class="brand">
                    <div class="logo">🧪</div>

                    <div>
                      <h1>Pocket Dashboard</h1>
                      <p>Cypress Automated Test Report</p>
                    </div>
                  </div>

                  <div class="status">
                    <span class="status-icon">
                      $STATUS_ICON
                    </span>

                    $STATUS_TEXT
                  </div>

                </div>

                <div class="meta">
                  <div class="pill">
                    Repository:
                    <strong>$REPOSITORY</strong>
                  </div>

                  <div class="pill">
                    Branch:
                    <strong>$BRANCH</strong>
                  </div>

                  <div class="pill">
                    Tag:
                    <strong>$TAG</strong>
                  </div>
                </div>

              </section>
              
              <section class="action">

                <div>
                  <h2>
                    Detailed Test Results
                  </h2>

                  <p>
                    View individual scenarios, screenshots,
                    assertions and test execution details.
                  </p>
                </div>

                <a
                  class="button"
                  href="./mochawesome/index.html"
                >
                  View Detailed Report →
                </a>

              </section>

              <section class="stats">

                <div class="card">
                  <div class="card-label">
                    Total Tests
                  </div>

                  <div class="card-value total">
                    $TESTS
                  </div>
                </div>

                <div class="card">
                  <div class="card-label">
                    Passed
                  </div>

                  <div class="card-value passed">
                    $PASSED
                  </div>
                </div>

                <div class="card">
                  <div class="card-label">
                    Failed
                  </div>

                  <div class="card-value failed">
                    $FAILED
                  </div>
                </div>

                <div class="card">
                  <div class="card-label">
                    Pending / Skipped
                  </div>

                  <div class="card-value pending">
                    $PENDING
                  </div>
                </div>

              </section>


              <section class="pass-rate">

                <div class="pass-rate-header">

                  <div class="pass-rate-title">
                    Overall Pass Rate
                  </div>

                  <div class="percentage">
                    $PASS_RATE%
                  </div>

                </div>

                <div class="progress">
                  <div class="progress-bar"></div>
                </div>

              </section>


              <section class="details">

                <div class="detail">
                  <div class="detail-label">
                    Duration
                  </div>

                  <div class="detail-value">
                    ⏱ $DURATION
                  </div>
                </div>

                <div class="detail">
                  <div class="detail-label">
                    Commit Author
                  </div>

                  <div class="detail-value">
                    👤 $AUTHOR
                  </div>
                </div>

                <div class="detail">
                  <div class="detail-label">
                    Commit
                  </div>

                  <div class="detail-value">
                    📝 $COMMIT_MESSAGE
                  </div>
                </div>

              </section>


             


              <footer>
                Pocket Dashboard · Cypress Automated Testing
              </footer>

            </div>

          </body>
          </html>
          EOF

            echo "Custom Cypress dashboard generated."

          else

            echo "No Mochawesome report was generated."

            cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Pocket Dashboard - Cypress Report</title>

            <style>
              body {
                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;

                background: #f8fafc;
                color: #0f172a;

                display: flex;
                align-items: center;
                justify-content: center;

                min-height: 100vh;
                margin: 0;
              }

              .box {
                background: white;
                padding: 45px;
                border-radius: 20px;
                text-align: center;

                box-shadow:
                  0 15px 40px rgba(15,23,42,.08);
              }

              h1 {
                margin-bottom: 10px;
              }

              p {
                color: #64748b;
              }
            </style>
          </head>

          <body>

            <div class="box">
              <h1>🧪 Pocket Dashboard</h1>
              <p>No Cypress report was generated for this run.</p>
            </div>

          </body>
          </html>
          EOF

          fi

      # ---------------------------------------------------------
      # DEPLOY TO GITHUB PAGES
      # ---------------------------------------------------------
      - name: Deploy Cypress report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          destination_dir: runs/${{ github.run_id }}
          keep_files: true
          force_orphan: false

      # ---------------------------------------------------------
      # SEND RESULT TO SLACK
      # ---------------------------------------------------------
      - name: Send Cypress result to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/runs/${{ github.run_id }}/"

          STATUS="${{ steps.result.outputs.status }}"
          ICON="${{ steps.result.outputs.slack_icon }}"

          TESTS="${{ steps.stats.outputs.tests }}"
          PASSED="${{ steps.stats.outputs.passed }}"
          FAILED="${{ steps.stats.outputs.failed }}"
          PENDING="${{ steps.stats.outputs.pending }}"
          DURATION="${{ steps.stats.outputs.duration }}"

          AUTHOR="${{ steps.commit.outputs.author }}"
          COMMIT_MESSAGE="${{ steps.commit.outputs.message }}"

          TAG="${{ github.event.inputs.tags }}"
          RUN_ID="${{ github.run_id }}"

          if [ -z "$TAG" ]; then
            TAG="All tests"
          fi

          PAYLOAD=$(jq -n \
            --arg icon "$ICON" \
            --arg status "$STATUS" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg tests "$TESTS" \
            --arg passed "$PASSED" \
            --arg failed "$FAILED" \
            --arg pending "$PENDING" \
            --arg duration "$DURATION" \
            --arg report "$REPORT_URL" \
            --arg author "$AUTHOR" \
            --arg commit "$COMMIT_MESSAGE" \
            --arg tag "$TAG" \
            --arg run_id "$RUN_ID" \
            --arg channel "CQTT5SY86" \
            '{
              channel: $channel,
              text: (
                $icon + " *Cypress Test Result: " + $status + "*\n\n" +

                "*Repository:* " + $repository + "\n" +
                "*Branch:* " + $branch + "\n" +
                "*Tag:* " + $tag + "\n" +
                "*Run ID:* " + $run_id + "\n\n" +

                "🧪 *Test Summary*\n" +
                "• Total Tests: " + $tests + "\n" +
                "• Passed: " + $passed + "\n" +
                "• Failed: " + $failed + "\n" +
                "• Pending/Skipped: " + $pending + "\n" +
                "• Duration: " + $duration + "\n\n" +

                "👤 *Commit Author:* " + $author + "\n" +
                "📝 *Commit Message:* " + $commit + "\n\n" +

                "📊 *Interactive Cypress Report:*\n" +
                $report
              )
            }')

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

      # ---------------------------------------------------------
      # FAIL WORKFLOW IF CYPRESS FAILED
      # ---------------------------------------------------------
      - name: Fail workflow if Cypress tests failed
        if: always()
        run: |
          if [ "${{ steps.cypress.outcome }}" != "success" ]; then
            echo "Cypress tests failed."
            exit 1
          fi