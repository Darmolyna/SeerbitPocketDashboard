name: Pocket Dashboard Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag to run"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # IMPORTANT:
      # Remove reports from previous runs so the generated
      # Mochawesome report contains ONLY this test run.
      - name: Clean previous Cypress reports
        run: |
          echo "Cleaning previous Cypress reports..."

          rm -rf cypress/reports
          rm -rf cypress/results
          rm -rf mochawesome-report
          rm -rf public

          mkdir -p cypress/reports

          echo "Report directories cleaned."

      - name: Record start time
        id: start_time
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Cypress tests
        id: cypress
        continue-on-error: true
        uses: cypress-io/github-action@v7
        with:
          record: true
          env: |
            tags=${{ github.event.inputs.tags }}

        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}

      - name: Record end time
        id: end_time
        if: always()
        run: |
          echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      # Generate report ONLY from JSON files created by this run.
      - name: Generate Mochawesome report
        if: always()
        run: |
          mkdir -p cypress/reports

          echo "Checking for Mochawesome JSON files..."

          if ls cypress/reports/*.json >/dev/null 2>&1; then

            echo "Mochawesome JSON files found:"
            ls -lah cypress/reports/*.json

            npx mochawesome-merge "cypress/reports/*.json" \
              -o cypress/reports/merged.json

            npx marge cypress/reports/merged.json \
              -f index \
              -o cypress/reports

            echo "Mochawesome report generated successfully."

          else
            echo "No Mochawesome JSON files found."
          fi

      - name: Extract Cypress test statistics
        id: stats
        if: always()
        run: |
          REPORT="cypress/reports/merged.json"

          if [ -f "$REPORT" ]; then

            PASSED=$(jq '.stats.passes // 0' "$REPORT")
            FAILED=$(jq '.stats.failures // 0' "$REPORT")
            PENDING=$(jq '.stats.pending // 0' "$REPORT")
            TESTS=$(jq '.stats.tests // 0' "$REPORT")
            DURATION=$(jq '.stats.duration // 0' "$REPORT")

          else

            PASSED=0
            FAILED=0
            PENDING=0
            TESTS=0
            DURATION=0

          fi

          DURATION_SECONDS=$((DURATION / 1000))

          MINUTES=$((DURATION_SECONDS / 60))
          SECONDS=$((DURATION_SECONDS % 60))

          if [ "$MINUTES" -gt 0 ]; then
            FORMATTED_DURATION="${MINUTES}m ${SECONDS}s"
          else
            FORMATTED_DURATION="${SECONDS}s"
          fi

          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          echo "duration=$FORMATTED_DURATION" >> "$GITHUB_OUTPUT"

      - name: Get commit information
        id: commit
        if: always()
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%an')
          MESSAGE=$(git log -1 --pretty=format:'%s')

          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          {
            echo "message<<EOF"
            echo "$MESSAGE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set Cypress result
        id: result
        if: always()
        run: |
          if [ "${{ steps.cypress.outcome }}" = "success" ]; then
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
            echo "icon=✅" >> "$GITHUB_OUTPUT"
            echo "slack_icon=:white_check_mark:" >> "$GITHUB_OUTPUT"
          else
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "icon=❌" >> "$GITHUB_OUTPUT"
            echo "slack_icon=:x:" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Cypress report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-html-report
          path: cypress/reports
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      # Clean GitHub Pages directory before publishing.
      # This prevents files from an older report from being reused.
      - name: Prepare report for GitHub Pages
        if: always()
        run: |
          rm -rf public
          mkdir -p public

          if [ -f cypress/reports/index.html ]; then

            cp -r cypress/reports/* public/

            echo "Latest Cypress report copied to GitHub Pages."

          else

            echo "Mochawesome report was not generated."

            cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Cypress Report</title>
          </head>
          <body>
            <h1>Cypress Report</h1>
            <p>No report was generated for this run.</p>
          </body>
          </html>
          EOF

          fi

      - name: Deploy Cypress report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Send Cypress result to Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |

          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          STATUS="${{ steps.result.outputs.status }}"
          ICON="${{ steps.result.outputs.slack_icon }}"

          TESTS="${{ steps.stats.outputs.tests }}"
          PASSED="${{ steps.stats.outputs.passed }}"
          FAILED="${{ steps.stats.outputs.failed }}"
          PENDING="${{ steps.stats.outputs.pending }}"
          DURATION="${{ steps.stats.outputs.duration }}"

          AUTHOR="${{ steps.commit.outputs.author }}"
          COMMIT_MESSAGE="${{ steps.commit.outputs.message }}"

          TAG="${{ github.event.inputs.tags }}"

          if [ -z "$TAG" ]; then
            TAG="All tests"
          fi

          PAYLOAD=$(jq -n \
            --arg icon "$ICON" \
            --arg status "$STATUS" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg tests "$TESTS" \
            --arg passed "$PASSED" \
            --arg failed "$FAILED" \
            --arg pending "$PENDING" \
            --arg duration "$DURATION" \
            --arg report "$REPORT_URL" \
            --arg author "$AUTHOR" \
            --arg commit "$COMMIT_MESSAGE" \
            --arg tag "$TAG" \
            '{
              text: (
                $icon + " *Cypress Test Result: " + $status + "*\n\n" +

                "*Repository:* " + $repository + "\n" +
                "*Branch:* " + $branch + "\n" +
                "*Tag:* " + $tag + "\n\n" +

                "🧪 *Test Summary*\n" +
                "• Total Tests: " + $tests + "\n" +
                "• Passed: " + $passed + "\n" +
                "• Failed: " + $failed + "\n" +
                "• Pending/Skipped: " + $pending + "\n" +
                "• Duration: " + $duration + "\n\n" +

                "👤 *Commit Author:* " + $author + "\n" +
                "📝 *Commit Message:* " + $commit + "\n\n" +

                "📊 *Interactive Cypress Report:*\n" +
                $report
              )
            }')

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

      - name: Fail workflow if Cypress tests failed
        if: always()
        run: |
          if [ "${{ steps.cypress.outcome }}" != "success" ]; then
            echo "Cypress tests failed."
            exit 1
          fi